<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Услуги — Vizion Labs</title>
    <meta name="description" content="Автоматизация, разработка ПО, маркетинг и продвижение — комплексные решения для вашего бизнеса.">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* временные стили для сетки (позже вынести в styles.css) */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }
        .service-card {
            background: rgba(17, 23, 34, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 1.8rem;
            border: 1px solid rgba(0, 195, 160, 0.2);
            transition: 0.2s;
            text-align: center;
        }
        .service-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 195, 160, 0.6);
            box-shadow: 0 12px 40px rgba(0,195,160,0.1);
        }
        .service-card i {
            font-size: 2.8rem;
            color: var(--gold, #00c3a0);
            margin-bottom: 1rem;
        }
        .service-card h3 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }
        .service-card p {
            color: #b0b8c4;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .service-card .btn {
            margin-top: 1.2rem;
        }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<div class="container">
    <nav class="top-nav" style="display:flex;justify-content:space-between;align-items:center;padding:1rem 0;">
        <a href="/" class="logo" style="font-size:1.5rem;font-weight:bold;">VIZION<span style="color:var(--gold);">LABS</span></a>
        <div>
            <a href="/" style="margin-right:1rem;">Главная</a>
            <a href="/services.html" style="color:var(--gold);">Услуги</a>
            <a href="/cases.html" style="margin-left:1rem;">Кейсы</a>
        </div>
    </nav>

    <header style="text-align:center;margin:3rem 0;">
        <h1>Решения для бизнеса, а не просто технологии</h1>
        <p class="subtitle">Мы автоматизируем, разрабатываем и продвигаем — под ключ.</p>
    </header>

    <div id="servicesContainer" class="services-grid">
        <div class="loading">Загрузка услуг...</div>
    </div>

    <!-- Модальное окно для деталей услуги -->
    <div id="serviceModal" class="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);justify-content:center;align-items:center;z-index:1000;">
        <div class="modal-content" style="background:#111722;border-radius:24px;max-width:600px;width:90%;padding:2rem;border:1px solid var(--gold);position:relative;">
            <span id="closeModal" style="position:absolute;top:1rem;right:1.5rem;font-size:2rem;cursor:pointer;color:var(--gold);">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <footer style="text-align:center;padding:2rem 0;margin-top:3rem;border-top:1px solid rgba(255,255,255,0.05);">
        <p>© 2026 Vizion Labs — ГК Ковенант / Vision Techno Lab</p>
    </footer>
</div>

<!-- Радиальное меню -->
<button id="radialToggle" class="radial-toggle"><i class="fas fa-compass"></i></button>
<div id="radialMenu" class="radial-menu hidden">
    <div class="radial-item" data-href="/"><i class="fas fa-home"></i><span>Главная</span></div>
    <div class="radial-item" data-href="/services.html"><i class="fas fa-cubes"></i><span>Услуги</span></div>
    <div class="radial-item" data-href="/cases.html"><i class="fas fa-briefcase"></i><span>Кейсы</span></div>
    <div class="radial-item" data-href="/labs.html"><i class="fas fa-tools"></i><span>Продукты</span></div>
    <div class="radial-item" data-href="/#contacts"><i class="fas fa-envelope"></i><span>Контакты</span></div>
    <div class="radial-item lang-toggle" data-lang="en"><i class="fas fa-globe"></i><span>English</span></div>
</div>

<script src="/js/starfield.js"></script>
<script src="/js/radial-menu.js"></script>
<script>
    fetch('/data/services.json')
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById('servicesContainer');
            container.innerHTML = data.services.map(s => `
                <div class="service-card" data-id="${s.id}">
                    <i class="fas ${s.icon}"></i>
                    <h3>${s.title}</h3>
                    <p>${s.short}</p>
                    <button class="btn-primary" onclick="openServiceModal('${s.id}')">Подробнее →</button>
                </div>
            `).join('');
        })
        .catch(err => {
            console.error(err);
            document.getElementById('servicesContainer').innerHTML = '<p>Ошибка загрузки услуг.</p>';
        });

    let servicesData = null;
    fetch('/data/services.json').then(res => res.json()).then(d => servicesData = d);

    function openServiceModal(id) {
        if (!servicesData) return;
        const service = servicesData.services.find(s => s.id === id);
        if (!service) return;

        const modal = document.getElementById('serviceModal');
        const body = document.getElementById('modalBody');
        body.innerHTML = `
            <h2>${service.title}</h2>
            <p style="margin:1rem 0;">${service.description}</p>
            <p><strong>Теги:</strong> ${service.tags.join(', ')}</p>
            <div style="margin-top:1.5rem;">
                <a href="/#contacts" class="btn-primary">Обсудить проект →</a>
            </div>
        `;
        modal.style.display = 'flex';
    }

    document.getElementById('closeModal').addEventListener('click', () => {
        document.getElementById('serviceModal').style.display = 'none';
    });
    window.addEventListener('click', (e) => {
        const modal = document.getElementById('serviceModal');
        if (e.target === modal) modal.style.display = 'none';
    });
</script>
</body>
</html>
